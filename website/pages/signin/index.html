<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign in</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="background-image">

    <header class="header">
        <img src="../../assets/images/njclogo.png"
             alt="NJC Logo"
             class="logo">
    </header>

    <main class="container">
        <section class="signin-card">
            <h1>Welcome!</h1>
            <p>Sign in to exchange your EcoCoins for rewards!</p>

            <button class="google-btn" id="emailPopupBtn" type="button">
                <span class="material-icons">login</span>
                <span>Sign in with email</span>
                <img src="../../assets/images/google.png" alt="Google logo" class="google-logo">
            </button>
        </section>
    </main>

    <div id="emailModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <h2>Sign in with your student account</h2>
            <form id="emailForm">
                <label for="emailInput">Student email</label>
                <input type="email" id="emailInput" name="email" autocomplete="username" required />
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" name="password" autocomplete="current-password" required />
                <button type="submit">Sign in</button>
                <p id="emailStatus" class="signin-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
