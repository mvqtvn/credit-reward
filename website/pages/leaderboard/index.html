<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
<div class="header-left">
    <img src="../../assets/images/njclogo.png" alt="NJC Logo" class="logo">
</div>
</header>

<!-- LEADERBOARD -->
<section class="leaderboard-section">
    <h2>Leaderboard</h2>
    <p class="term-title">2026 Term 3</p>

<!-- GRAPH SCALE -->
    <div class="graph-scale">
        <span>0</span>
        <span>1,000</span>
    </div>

  <!-- BAR CHART -->
  <div class="bar-chart">

      <!-- AERIUS -->
      <div class="bar-row">
          <div class="house-name">Aerius</div>
          <div class="bar-wrapper">
              <div class="bar bar-aerius"></div>
          </div>
          <div class="points">1,750</div>
      </div>
      <!-- LIGNUM -->
      <div class="bar-row">
          <div class="house-name">Lignum</div>
          <div class="bar-wrapper">
              <div class="bar bar-lignum"></div>
          </div>
          <div class="points">1,500</div>
      </div>
      <!-- IGNIS -->
      <div class="bar-row">
          <div class="house-name">Ignis</div>
          <div class="bar-wrapper">
              <div class="bar bar-ignis"></div>
          </div>
          <div class="points">1,320</div>
      </div>
      <!-- AQUA -->
      <div class="bar-row">
          <div class="house-name">Aqua</div>
          <div class="bar-wrapper">
              <div class="bar bar-aqua"></div>
          </div>
          <div class="points">1,250</div>
      </div>
      <!-- TERRA -->
      <div class="bar-row">
          <div class="house-name">Terra</div>
          <div class="bar-wrapper">
              <div class="bar bar-terra"></div>
          </div>
          <div class="points">1,150</div>
      </div>
      <!-- SOLARIS -->
      <div class="bar-row">
          <div class="house-name">Solaris</div>
          <div class="bar-wrapper">
              <div class="bar bar-solaris"></div>
          </div>
          <div class="points">1,000</div>
      </div>
    </div>
</section>


            <!-- TERM PROGRESS SECTION -->
            <section class="bottom-section">

                <div class="term-progress-card">

                    <div class="term-name">
                        Term 3
                    </div>

                    <div class="progress-bar">

                        <div class="progress-fill"></div>

                    </div>

                    <div class="percentage">
                        84%
                    </div>

                </div>


                <!-- REWARDS CARD -->
                <div class="rewards-card">

                    <h3>Rewards</h3>

                    <p>1<sup>st</sup> - 50 points each</p>
                    <p>2<sup>nd</sup> - 20 points each</p>
                    <p>3<sup>rd</sup> - 10 points each</p>

                </div>

            </section>

        </main>


<!-- bottom nav -->
<footer class="bottom-banner">
    <nav class="nav-links">
        <a href="../dashboard/index.html" class="nav-btn">Dashboard</a>
        <a href="../rewards/index.html" class="nav-btn">Rewards</a>
        <a href="../leaderboard/index.html" class="nav-btn">Leaderboard</a>
        <a href="../settings/index.html" class="nav-btn">Settings</a>
    </nav>
</footer>

</body>
</html>
