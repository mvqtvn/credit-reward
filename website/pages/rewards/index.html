<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Junior College - Rewards</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<!-- Header -->
<header class="header">
    <div class="header-left">
        <img src="../../assets/images/njclogo.png" alt="NJC Logo" class="logo">
    </div>
</header>

<!-- Rewards grid (Dynamically populated from database/CSV via script.js) -->
<div class="content"></div>

<main class="rewards-page">
  <section class="unredeemed-section" aria-labelledby="unredeemed-heading">
    <h1 id="unredeemed-heading">Unredeemed rewards</h1>
    <p id="unredeemedStatus" class="unredeemed-status" role="status" aria-live="polite">
      Sign in to view your unredeemed rewards.
    </p>
    <ul id="unredeemedRewards" class="unredeemed-list"></ul>
  </section>
</main>

<!-- Details overlay -->
<div id="detailsOverlay" class="overlay" onclick="closeDetails(event)">
  <div class="details-card" onclick="event.stopPropagation()">
    <!-- Photo Carousel Area -->
    <div class="carousel-container">
      <button class="carousel-btn prev-btn" onclick="changePhoto(-1)">&#10094;</button>
      <img id="modalImage" src="" alt="Product Photo">
      <button class="carousel-btn next-btn" onclick="changePhoto(1)">&#10095;</button>
    </div>
    
    <!-- Info Section below Photo -->
    <div class="details-info">
      <div class="details-header">
        <h2 id="modalTitle">placeholder: Name</h2>
        <span id="modalPrice" class="details-price">placeholder: price</span>
      </div>
      <p id="modalStock" class="details-stock">placeholder: stock number</p>
      <hr class="divider">
      <p id="modalDescription">placeholder: product description</p>
      <div id="houseDesignField" class="house-design-field" hidden>
        <label for="houseDesign">Choose a house design</label>
        <select id="houseDesign" name="houseDesign">
          <option value="">Select a house</option>
          <option value="Ignis">Ignis</option>
          <option value="Lignum">Lignum</option>
          <option value="Solaris">Solaris</option>
          <option value="Terra">Terra</option>
          <option value="Aqua">Aqua</option>
          <option value="Aerius">Aerius</option>
        </select>
      </div>
      <p id="purchaseStatus" class="purchase-status" role="status" aria-live="polite"></p>
      <button id="purchaseButton" class="purchase-btn" type="button">Purchase reward</button>
      <button class="close-btn" onclick="document.getElementById('detailsOverlay').classList.remove('active')">Close</button>
    </div>
  </div>
</div>

<!-- bottom nav  -->
<footer class="bottom-banner">
    <nav class="nav-links" aria-label="Main navigation">
        <a href="../dashboard/index.html" class="nav-btn">Dashboard</a>
        <a href="../rewards/index.html" class="nav-btn" aria-current="page">Rewards</a>
        <a href="../leaderboard/index.html" class="nav-btn">Leaderboard</a>
        <a href="../settings/index.html" class="nav-btn">Settings</a>
    </nav>
</footer>
<script src="script.js"></script>
</body>
</html>
