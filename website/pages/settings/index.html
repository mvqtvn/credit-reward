<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="page-container">


        <!-- ================= HEADER ================= -->

        <header class="header">

            <!-- Replace this later with your actual NJC logo -->
            <div class="school-logo">
                <span>NJC</span>
                <small>Logo</small>
            </div>

            <h1>National Junior College</h1>

        </header>



        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">

            <h2>Settings</h2>


            <!-- ================= ACCOUNT DETAILS ================= -->

            <section class="account-card">

                <!-- Unique ID -->
                <div class="setting-row">

                    <span class="setting-label">
                        Your Unique ID
                    </span>

                    <span class="setting-value">
                        ABC123456789
                    </span>

                </div>


                <!-- Email -->
                <div class="setting-row">

                    <span class="setting-label">
                        Email
                    </span>

                    <div class="email-container">

                        <span class="email">
                            studentname@students.edu.sg
                        </span>

                        <!-- Edit icon -->
                        <button class="edit-button" aria-label="Edit email">
                            ✎
                        </button>

                    </div>

                </div>

            </section>



            <!-- ================= REPORT BUG ================= -->

            <button class="report-button">

                <span>
                    Report a Bug
                </span>

                <span class="bug-icon">
                    ♟
                </span>

            </button>



            <!-- ================= LOGOUT ================= -->

            <button class="logout-button">
                Logout
            </button>


        </main>



<!-- bottom nav-->
<footer class="bottom-banner">
    <nav class="nav-links">
        <a href="../dashboard/index.html" class="nav-btn">Dashboard</a>
        <a href="../rewards/index.html" class="nav-btn">Rewards</a>
        <a href="../leaderboard/index.html" class="nav-btn">Leaderboard</a>
        <a href="../settings/index.html" class="nav-btn">Settings</a>
    </nav>
</footer>



</body>
</html>
