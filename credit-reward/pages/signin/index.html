<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign in</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">
</head>

<body class="background-image">

    <header class="header">

        <img src="/assests/images/njclogo.png"
             alt="NJC Logo"
             class="logo">

    </header>

    <main class="container">

        <section class="signin-card">

            <h1>Welcome back!</h1>
            <p>Sign in to continue to your rewards dashboard.</p>

            <button class="google-btn" id="googleSignInBtn" type="button">
                <span class="material-icons">
                    login
                </span>

                <span>Sign in with Google</span>
                <img src="/assests/images/google.png" alt="Google logo" class="google-logo">
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
